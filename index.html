<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#fff7ea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="촉감런" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>촉감런 - ASMR Prototype</title>
  <style>
    :root { color-scheme: light; --ink:#242126; --panel:rgba(255,255,255,.80); }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff7ea;font-family:ui-rounded,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
    #app{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#fffdf8 0,#fff6e7 42%,#f8e4c9 100%)}
    #shell{position:relative;width:min(100vw,calc(100dvh * 16 / 9),1180px);height:min(100dvh,calc(100vw * 9 / 16),664px);overflow:hidden;background:linear-gradient(#dff4ff 0 68%,#fff6de 68% 100%);box-shadow:0 0 70px #d7b98e55;isolation:isolate;border-radius:18px}
    canvas{display:block;width:100%;height:100%}
    #hud{position:absolute;left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:grid;grid-template-columns:minmax(220px,420px) auto;justify-content:space-between;gap:12px;pointer-events:none}
    .glass{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid #ffffffcc;box-shadow:0 8px 24px #866a4530;border-radius:18px}
    #hpBox{padding:10px 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:13px}
    #hpTrack{height:11px;margin-top:7px;border-radius:99px;background:#2d253319;overflow:hidden;border:1px solid #ffffffcc}
    #hpFill{height:100%;width:100%;background:linear-gradient(90deg,#ff6868,#ffb45c);border-radius:inherit;transform-origin:left}
    #distanceBox{padding:9px 13px;min-width:90px;text-align:right}.small{font-size:10px;font-weight:800;opacity:.55;letter-spacing:.08em}.big{font-size:22px;font-weight:1000;line-height:1}
    #controlsGuide{position:absolute;top:max(68px,calc(env(safe-area-inset-top) + 56px));left:50%;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:12px;padding:7px 12px;font-size:11px;font-weight:900;white-space:nowrap;pointer-events:none}
    #controlsGuide span{display:flex;align-items:center;gap:4px}
    #controlsGuide kbd{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:6px;background:#fff;border:1px solid #24212624;box-shadow:0 2px 0 #24212622;font:900 10px/1 system-ui,sans-serif}
    #combo{position:absolute;top:108px;left:50%;transform:translateX(-50%);font-weight:1000;text-align:center;pointer-events:none;text-shadow:0 2px 0 #fff}.comboN{font-size:30px}.comboT{font-size:10px;letter-spacing:.18em;opacity:.65}
    #toast{position:absolute;left:55%;top:38%;transform:translate(-50%,-50%) scale(.85);font-size:34px;font-weight:1000;opacity:0;pointer-events:none;text-align:center;white-space:nowrap;text-shadow:0 3px 0 #fff,0 8px 18px #3a252444}
    #toast.show{animation:pop .58s ease-out}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}55%{opacity:1;transform:translate(-50%,-56%) scale(1)}100%{opacity:0;transform:translate(-50%,-74%) scale(.95)}}
    #hint{position:absolute;left:50%;bottom:max(12px,calc(env(safe-area-inset-bottom) + 8px));transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:#242126d9;color:white;font-size:12px;font-weight:900;letter-spacing:.02em;pointer-events:none;box-shadow:0 10px 25px #1b13263b;transition:.25s opacity;white-space:nowrap}
    #overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(#ffffff18,#fff7eac0);z-index:4}
    #card{width:min(92%,520px);padding:18px 24px 16px;text-align:center}.logo{height:74px;display:grid;place-items:center;margin-bottom:4px}.logo img{height:72px;width:auto;image-rendering:auto}.title{font-size:27px!important}.sub{margin:8px 5px 10px!important}.title{font-size:31px;font-weight:1000;line-height:1.05;letter-spacing:-.04em}.sub{font-size:13px;line-height:1.55;opacity:.68;margin:11px 5px 18px}.chips{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:13px 0 20px}.chip{padding:7px 10px;border-radius:99px;background:#fff;border:1px solid #302b2818;font-size:11px;font-weight:900}
    button{border:0;border-radius:16px;width:100%;padding:15px 16px;font-size:16px;font-weight:1000;background:#27222a;color:white;box-shadow:0 8px 0 #100d12,0 15px 25px #1b132628;cursor:pointer}button:active{transform:translateY(5px);box-shadow:0 3px 0 #100d12,0 8px 15px #1b13261f}.best{margin-top:15px;font-size:12px;font-weight:900;opacity:.6}
    #installBtn{margin-top:11px;background:#fff;color:#27222a;border:1px solid #27222a22;box-shadow:none;padding:11px;font-size:12px;display:none}
    #soundStatus{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(12px,calc(env(safe-area-inset-bottom) + 8px));font-size:10px;font-weight:900;opacity:.45;pointer-events:none}
    #rotateNotice{display:none;position:fixed;inset:0;z-index:20;background:#fff7ea;place-items:center;text-align:center;padding:28px;font-weight:1000;font-size:22px}
    #rotateNotice small{display:block;font-size:13px;margin-top:10px;opacity:.6}
    @media (orientation:portrait) and (max-width:700px){#rotateNotice{display:grid}}
    @media (max-height:460px){#hud{top:8px}.glass{border-radius:14px}#hpBox{padding:7px 10px}#distanceBox{padding:7px 11px}.big{font-size:19px}#controlsGuide{top:54px;padding:5px 9px;font-size:9px;gap:8px}#controlsGuide kbd{height:18px;min-width:20px;font-size:8px}#combo{top:82px}.comboN{font-size:24px}#hint{font-size:10px;padding:7px 12px}#soundStatus{font-size:9px}#card{width:min(82%,500px);padding:12px 18px}.logo{height:54px}.logo img{height:52px}.title{font-size:22px!important}.sub{font-size:11px!important}.chips{display:none}button{padding:11px 14px;font-size:14px}.best{margin-top:9px}}
  </style>
</head>
<body>
<div id="rotateNotice">↻ 휴대폰을 가로로 돌려주세요<small>이 게임은 가로 화면에 맞춰졌어요.</small></div>
<div id="app"><div id="shell">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="hpBox" class="glass"><div class="row"><span>❤️ 체력</span><span id="hpText">100</span></div><div id="hpTrack"><div id="hpFill"></div></div></div>
    <div id="distanceBox" class="glass"><div class="small">DISTANCE</div><div class="big"><span id="meters">0</span><small style="font-size:11px">m</small></div></div>
  </div>
  <div id="controlsGuide" class="glass" aria-label="키 조작 안내">
    <span><kbd>↑</kbd><kbd>SPACE</kbd> 점프</span>
    <span><kbd>SHIFT</kbd> 슬라이딩</span>
    <span><kbd>↓</kbd><kbd>S</kbd> 웅크리기</span>
  </div>
  <div id="combo"><div class="comboN" id="comboN"></div><div class="comboT" id="comboT"></div></div>
  <div id="toast">PERFECT!</div>
  <div id="hint">화면 탭 = 점프 · PC에서는 상단 키 조작도 가능</div>
  <div id="soundStatus">🔊 실제 ASMR 샘플 ON</div>
  <div id="overlay">
    <div id="card" class="glass">
      <div class="logo"><img src="sprites/run1.png" alt="촉감런 캐릭터"></div>
      <div class="title">촉감런<br>ASMR PROTO</div>
      <div class="sub">키보드 위를 달리며 ASMR을 듣고<br>점프해 <b>왁스볼·말랑이·뽁뽁이</b>를 터뜨려봐.</div>
      <div class="chips"><span class="chip">🟣 말랑</span><span class="chip">🟠 왁스</span><span class="chip">🔵 뽁뽁</span></div>
      <button id="startBtn">탭해서 시작</button>
      <button id="installBtn">📲 홈 화면에 설치</button>
      <div class="best" id="bestText">BEST 0m</div>
    </div>
  </div>
</div></div>
<script src="game.js?v=8-optimized-realistic"></script>
</body>
</html>
